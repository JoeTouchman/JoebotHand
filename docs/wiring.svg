<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1070" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>JoebotHand wiring diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="npn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#24292f"/>
    </marker>
    <style>
      .box   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .chip  { fill: #eef6ee; stroke: #2da44e; stroke-width: 1.5; }
      .t     { fill: #1f2328; font-size: 15px; font-weight: 600; }
      .s     { fill: #57606a; font-size: 12px; }
      .pin   { fill: #1f2328; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pos   { stroke: #d1242f; stroke-width: 2.5; fill: none; }
      .gnd   { stroke: #24292f; stroke-width: 2.5; fill: none; }
      .sig   { stroke: #e36209; stroke-width: 2.5; fill: none; }
      .rail-pos { stroke: #d1242f; stroke-width: 5; stroke-linecap: round; }
      .rail-gnd { stroke: #24292f; stroke-width: 5; stroke-linecap: round; }
      .dot-pos { fill: #d1242f; }
      .dot-gnd { fill: #24292f; }
      .dot-sig { fill: #e36209; }
    </style>
  </defs>

  <rect x="0" y="0" width="1300" height="1070" rx="18" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" fill="#1f2328" font-size="26" font-weight="700">JoebotHand wiring</text>
  <text x="40" y="78" class="s" font-size="14">One 5 V supply powers everything through the power switch. Signals come from the ESP32-S3.</text>

  <!-- ===== Power chain ===== -->
  <rect class="box" x="40"  y="110" width="150" height="70" rx="10"/>
  <text class="t" x="115" y="140" text-anchor="middle">Wall outlet</text>
  <text class="s" x="115" y="160" text-anchor="middle">AC mains</text>

  <rect class="box" x="230" y="110" width="190" height="70" rx="10"/>
  <text class="t" x="325" y="140" text-anchor="middle">AC → DC adapter</text>
  <text class="s" x="325" y="160" text-anchor="middle">5 V ⎓ 5 A</text>

  <rect class="box" x="460" y="110" width="190" height="70" rx="10"/>
  <text class="t" x="555" y="140" text-anchor="middle">Screw terminal</text>
  <text class="s" x="555" y="160" text-anchor="middle">on the adapter's plug</text>
  <text class="pin" x="490" y="176" text-anchor="middle" font-weight="700">−</text>
  <text class="pin" x="640" y="149" text-anchor="end" font-weight="700">+</text>

  <rect class="box" x="700" y="110" width="230" height="70" rx="10"/>
  <text class="t" x="815" y="140" text-anchor="middle">Power switch</text>
  <text class="s" x="815" y="160" text-anchor="middle">panel button with LED ring</text>

  <line x1="190" y1="145" x2="228" y2="145" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="145" x2="458" y2="145" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line class="pos" x1="650" y1="145" x2="700" y2="145"/>
  <line class="pos" x1="815" y1="180" x2="815" y2="230"/>
  <line class="gnd" x1="490" y1="180" x2="490" y2="290"/>

  <!-- ===== Breadboard rails ===== -->
  <line class="rail-pos" x1="540" y1="230" x2="1250" y2="230"/>
  <line class="rail-gnd" x1="300" y1="290" x2="1215" y2="290"/>
  <text x="1245" y="218" text-anchor="end" fill="#d1242f" font-size="13" font-weight="600">+5 V rail (live only when the switch is on)</text>
  <text x="1205" y="312" text-anchor="end" fill="#24292f" font-size="13" font-weight="600">GND rail</text>
  <text x="300" y="312" class="s">breadboard</text>

  <circle class="dot-pos" cx="815" cy="230" r="5"/>
  <circle class="dot-gnd" cx="490" cy="290" r="5"/>

  <!-- 1000 uF capacitor across the rails -->
  <circle class="dot-pos" cx="700" cy="230" r="5"/>
  <line class="pos" x1="700" y1="230" x2="700" y2="250"/>
  <line x1="684" y1="250" x2="716" y2="250" stroke="#1f2328" stroke-width="3"/>
  <path d="M684 264 Q700 255 716 264" stroke="#1f2328" stroke-width="3" fill="none"/>
  <line class="gnd" x1="700" y1="260" x2="700" y2="290"/>
  <circle class="dot-gnd" cx="700" cy="290" r="5"/>
  <text x="678" y="248" text-anchor="end" fill="#1f2328" font-size="13" font-weight="700">+</text>
  <text x="726" y="257" fill="#1f2328" font-size="13" font-weight="600">1000 µF</text>
  <text x="726" y="274" class="s" font-size="11">smooths servo current spikes</text>

  <!-- ===== ESP32-S3 ===== -->
  <rect class="chip" x="330" y="340" width="250" height="590" rx="12"/>
  <text class="t" x="420" y="616" text-anchor="middle" font-size="18">ESP32-S3</text>
  <text class="s" x="420" y="638" text-anchor="middle">DevKitC-1 (N16R8)</text>
  <text class="s" x="420" y="656" text-anchor="middle">USB-C for flashing</text>

  <!-- power pins (top edge) -->
  <text class="pin" x="400" y="362" text-anchor="middle">GND</text>
  <text class="pin" x="560" y="362" text-anchor="middle">5V</text>
  <line class="gnd" x1="400" y1="340" x2="400" y2="290"/>
  <circle class="dot-gnd" cx="400" cy="290" r="5"/>
  <line class="pos" x1="560" y1="340" x2="560" y2="230"/>
  <circle class="dot-pos" cx="560" cy="230" r="5"/>

  <!-- signal pins (right edge) -->
  <text class="pin" x="570" y="404" text-anchor="end">GPIO 4</text>
  <text class="pin" x="570" y="484" text-anchor="end">GPIO 5</text>
  <text class="pin" x="570" y="564" text-anchor="end">GPIO 6</text>
  <text class="pin" x="570" y="644" text-anchor="end">GPIO 7</text>
  <text class="pin" x="570" y="724" text-anchor="end">GPIO 15</text>
  <text class="pin" x="570" y="834" text-anchor="end">GPIO 16</text>
  <text class="pin" x="570" y="894" text-anchor="end">GPIO 17</text>

  <!-- ===== Servos ===== -->
  <!-- +5 V bus (x=1250) and GND bus (x=1215) down the right side -->
  <line class="pos" x1="1250" y1="230" x2="1250" y2="790"/>
  <line class="gnd" x1="1215" y1="290" x2="1215" y2="930"/>

  <g>
    <line class="sig" x1="580" y1="400" x2="900" y2="400"/>
    <rect class="box" x="900" y="372" width="230" height="56" rx="10"/>
    <text class="t" x="918" y="396">Thumb servo</text>
    <text class="s" x="918" y="415">MG90S</text>
    <line class="pos" x1="1130" y1="388" x2="1250" y2="388"/>
    <line class="gnd" x1="1130" y1="412" x2="1215" y2="412"/>
    <circle class="dot-pos" cx="1250" cy="388" r="5"/>
    <circle class="dot-gnd" cx="1215" cy="412" r="5"/>
  </g>
  <g>
    <line class="sig" x1="580" y1="480" x2="900" y2="480"/>
    <rect class="box" x="900" y="452" width="230" height="56" rx="10"/>
    <text class="t" x="918" y="476">Index servo</text>
    <text class="s" x="918" y="495">MG90S</text>
    <line class="pos" x1="1130" y1="468" x2="1250" y2="468"/>
    <line class="gnd" x1="1130" y1="492" x2="1215" y2="492"/>
    <circle class="dot-pos" cx="1250" cy="468" r="5"/>
    <circle class="dot-gnd" cx="1215" cy="492" r="5"/>
  </g>
  <g>
    <line class="sig" x1="580" y1="560" x2="900" y2="560"/>
    <rect class="box" x="900" y="532" width="230" height="56" rx="10"/>
    <text class="t" x="918" y="556">Middle servo</text>
    <text class="s" x="918" y="575">MG90S</text>
    <line class="pos" x1="1130" y1="548" x2="1250" y2="548"/>
    <line class="gnd" x1="1130" y1="572" x2="1215" y2="572"/>
    <circle class="dot-pos" cx="1250" cy="548" r="5"/>
    <circle class="dot-gnd" cx="1215" cy="572" r="5"/>
  </g>
  <g>
    <line class="sig" x1="580" y1="640" x2="900" y2="640"/>
    <rect class="box" x="900" y="612" width="230" height="56" rx="10"/>
    <text class="t" x="918" y="636">Ring servo</text>
    <text class="s" x="918" y="655">MG90S</text>
    <line class="pos" x1="1130" y1="628" x2="1250" y2="628"/>
    <line class="gnd" x1="1130" y1="652" x2="1215" y2="652"/>
    <circle class="dot-pos" cx="1250" cy="628" r="5"/>
    <circle class="dot-gnd" cx="1215" cy="652" r="5"/>
  </g>
  <g>
    <line class="sig" x1="580" y1="720" x2="900" y2="720"/>
    <rect class="box" x="900" y="692" width="230" height="56" rx="10"/>
    <text class="t" x="918" y="716">Pinky servo</text>
    <text class="s" x="918" y="735">MG90S</text>
    <line class="pos" x1="1130" y1="708" x2="1250" y2="708"/>
    <line class="gnd" x1="1130" y1="732" x2="1215" y2="732"/>
    <circle class="dot-pos" cx="1250" cy="708" r="5"/>
    <circle class="dot-gnd" cx="1215" cy="732" r="5"/>
  </g>
  <text x="770" y="392" text-anchor="middle" class="s" font-size="11">PWM signal, 50 Hz</text>

  <!-- ===== Status LED driver ===== -->
  <line class="sig" x1="580" y1="830" x2="660" y2="830"/>
  <rect x="660" y="821" width="60" height="18" rx="3" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="690" y="812" text-anchor="middle" fill="#1f2328" font-size="12" font-weight="600">330 Ω</text>
  <line class="sig" x1="720" y1="830" x2="970" y2="830"/>

  <!-- S8050 NPN transistor -->
  <circle cx="988" cy="830" r="30" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <line x1="972" y1="810" x2="972" y2="850" stroke="#1f2328" stroke-width="3.5"/>
  <line x1="972" y1="820" x2="1000" y2="800" stroke="#1f2328" stroke-width="2.5"/>
  <line x1="972" y1="840" x2="998" y2="858" stroke="#1f2328" stroke-width="2.5" marker-end="url(#npn)"/>
  <text x="1014" y="884" fill="#1f2328" font-size="13" font-weight="600">S8050 NPN</text>
  <text x="1014" y="900" class="s" font-size="11">switches the LED's ground side</text>

  <!-- collector -> LED ring -> +5 V -->
  <polyline points="1000,800 1000,790 1084,790" stroke="#57606a" stroke-width="2.5" fill="none"/>
  <polygon points="1086,790 1116,774 1116,806" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <line x1="1086" y1="774" x2="1086" y2="806" stroke="#1f2328" stroke-width="3"/>
  <line x1="1096" y1="770" x2="1088" y2="758" stroke="#1f2328" stroke-width="1.5" marker-end="url(#npn)"/>
  <line x1="1108" y1="770" x2="1100" y2="758" stroke="#1f2328" stroke-width="1.5" marker-end="url(#npn)"/>
  <line class="pos" x1="1116" y1="790" x2="1250" y2="790"/>
  <circle class="dot-pos" cx="1250" cy="790" r="5"/>
  <text x="1100" y="830" text-anchor="middle" fill="#1f2328" font-size="13" font-weight="600">Status LED ring</text>
  <text x="1100" y="846" text-anchor="middle" class="s" font-size="11">built into the power switch</text>

  <!-- emitter -> GND -->
  <line class="gnd" x1="1000" y1="860" x2="1000" y2="930"/>
  <circle class="dot-gnd" cx="1000" cy="930" r="5"/>

  <!-- ===== Buzzer ===== -->
  <line class="sig" x1="580" y1="890" x2="680" y2="890"/>
  <rect x="680" y="872" width="70" height="36" rx="18" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="715" y="895" text-anchor="middle" fill="#1f2328" font-size="12" font-weight="600">piezo</text>
  <text x="715" y="864" text-anchor="middle" fill="#1f2328" font-size="13" font-weight="600">Passive buzzer</text>
  <polyline class="gnd" points="750,890 780,890 780,930 1215,930"/>

  <!-- ===== Legend and notes ===== -->
  <line x1="40" y1="970" x2="1260" y2="970" stroke="#d0d7de" stroke-width="1"/>
  <line class="pos" x1="40" y1="1000" x2="80" y2="1000"/>
  <text x="90" y="1004" class="s" font-size="13">+5 V</text>
  <line class="gnd" x1="150" y1="1000" x2="190" y2="1000"/>
  <text x="200" y="1004" class="s" font-size="13">ground</text>
  <line class="sig" x1="275" y1="1000" x2="315" y2="1000"/>
  <text x="325" y="1004" class="s" font-size="13">signal from the ESP32 (3.3 V)</text>
  <circle class="dot-gnd" cx="540" cy="1000" r="5"/>
  <text x="552" y="1004" class="s" font-size="13">connected. Lines that cross without a dot are not connected.</text>
  <text x="40" y="1036" class="s" font-size="13">The servos draw power straight from the rails, never through the ESP32. Every part shares one ground.</text>
</svg>
