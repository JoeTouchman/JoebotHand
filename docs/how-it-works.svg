<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 486" width="784" height="486" font-family="Helvetica, Arial, sans-serif">
  <title>How the hand works</title>

  <!-- ===== Lane: phone ===== -->
  <rect x="12" y="12" width="300" height="462" fill="none" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="12" y="12" width="300" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="162" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">Phone (web app)</text>

  <rect x="62" y="82" width="200" height="76" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="162" y="116" font-size="20" text-anchor="middle" fill="#000000">Camera</text>
  <text x="162" y="139" font-size="15" text-anchor="middle" fill="#333333">live video</text>

  <rect x="62" y="222" width="200" height="76" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="162" y="256" font-size="20" text-anchor="middle" fill="#000000">MediaPipe</text>
  <text x="162" y="279" font-size="15" text-anchor="middle" fill="#333333">hand landmark model</text>

  <rect x="62" y="362" width="200" height="76" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="162" y="396" font-size="20" text-anchor="middle" fill="#000000">Curl calculation</text>
  <text x="162" y="419" font-size="15" text-anchor="middle" fill="#333333">per finger, 0–100%</text>

  <!-- ===== Lane: hand ===== -->
  <rect x="472" y="12" width="300" height="462" fill="none" stroke="#82b366" stroke-width="1.5"/>
  <rect x="472" y="12" width="300" height="40" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="622" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">Robotic hand</text>

  <rect x="522" y="82" width="200" height="76" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="622" y="116" font-size="20" text-anchor="middle" fill="#000000">Fingers</text>
  <text x="622" y="139" font-size="15" text-anchor="middle" fill="#333333">thumb to pinky</text>

  <rect x="522" y="222" width="200" height="76" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="622" y="256" font-size="20" text-anchor="middle" fill="#000000">Servos</text>
  <text x="622" y="279" font-size="15" text-anchor="middle" fill="#333333">5 × MG90S</text>

  <rect x="522" y="362" width="200" height="76" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="622" y="396" font-size="20" text-anchor="middle" fill="#000000">ESP32-S3</text>
  <text x="622" y="419" font-size="15" text-anchor="middle" fill="#333333">firmware</text>

  <!-- ===== Edges (draw.io "classic" arrowheads) ===== -->
  <g stroke="#7d8590" stroke-width="1.5" fill="none">
    <line x1="162" y1="158" x2="162" y2="213"/>
    <line x1="162" y1="298" x2="162" y2="353"/>
    <line x1="622" y1="362" x2="622" y2="307"/>
    <line x1="622" y1="222" x2="622" y2="167"/>
    <line x1="262" y1="400" x2="513" y2="400" stroke-dasharray="7 5"/>
  </g>
  <g fill="#7d8590">
    <path d="M162 222 L156 210 L162 213 L168 210 Z"/>
    <path d="M162 362 L156 350 L162 353 L168 350 Z"/>
    <path d="M622 298 L616 310 L622 307 L628 310 Z"/>
    <path d="M622 158 L616 170 L622 167 L628 170 Z"/>
    <path d="M522 400 L510 394 L513 400 L510 406 Z"/>
  </g>

  <!-- edge labels: chips so they read on light and dark pages -->
  <g fill="#f6f8fa" stroke="#d0d7de" stroke-width="1">
    <rect x="110" y="178" width="104" height="24" rx="5"/>
    <rect x="108" y="318" width="108" height="24" rx="5"/>
    <rect x="570" y="318" width="104" height="24" rx="5"/>
    <rect x="590" y="178" width="64" height="24" rx="5"/>
    <rect x="322" y="375" width="140" height="50" rx="6"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#1f2328">
    <text x="162" y="195">video frames</text>
    <text x="162" y="335">21 landmarks</text>
    <text x="622" y="335">PWM, 50 Hz</text>
    <text x="622" y="195">strings</text>
    <text x="392" y="396">Secure WebSocket</text>
    <text x="392" y="416">Wi-Fi, ~30 Hz</text>
  </g>
</svg>
